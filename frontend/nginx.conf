server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS embutido do Docker. Sem isso, "backend" no proxy_pass e resolvido
    # uma unica vez na inicializacao do nginx - se o container do frontend
    # subir antes do backend estar resolvivel (sem depends_on entre eles,
    # de proposito - o frontend serve estaticos e nao precisa que o backend
    # ja esteja de pe pra iniciar), o nginx inteiro recusa iniciar. Com
    # resolver + variavel, a resolucao acontece a cada requisicao: nginx
    # sempre sobe, e so falha (502) enquanto o backend nao estiver
    # disponivel.
    resolver 127.0.0.11 valid=10s;

    # Service worker (vite-plugin-pwa) nunca deve ficar em cache do browser -
    # o app so recebe atualizacoes se o navegador buscar a versao mais nova
    # do sw.js a cada carregamento.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vue Router em History Mode: qualquer rota que nao seja um arquivo
    # estatico real cai no index.html, deixando o roteador decidir - inclui
    # tanto /captura/* quanto /admin/* (docs/adr/0003-frontend-unico-pwa.md).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mesma origem do frontend, sem CORS - proxy interno pelo nome do
    # servico na rede Docker (backend nunca fica exposto no host, ver
    # docker/compose.prod.yml).
    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upload de áudio (POST .../sincronizar, multipart) pode levar mais
        # que o timeout padrão do nginx em conexão de campo mais lenta.
        client_max_body_size 30m;
        proxy_read_timeout 60s;
    }

    location /health {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
    }
}
