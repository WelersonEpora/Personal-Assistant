name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------- backend
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # Um único banco cobre dev e test neste job efêmero de CI - POSTGRES_DB
      # e POSTGRES_DB_TEST abaixo apontam para o mesmo nome, então
      # "db:migrate" (env development) já deixa o schema pronto para os
      # testes de integração (env test) sem precisar de um segundo createdb.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: personal_assistant_test
          POSTGRES_USER: personal_assistant
          POSTGRES_PASSWORD: personal_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personal_assistant -d personal_assistant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: development
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: personal_assistant_test
      POSTGRES_DB_TEST: personal_assistant_test
      POSTGRES_USER: personal_assistant
      POSTGRES_PASSWORD: personal_assistant
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run db:migrate

      - name: Run tests
        run: npm test

  # --------------------------------------------------------------- frontend
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # ----------------------------------------------- build & publish (GHCR)
  # Só builda/publica depois que os dois jobs de teste passam, e só em push
  # direto para main (nunca em pull_request de fora) - evita publicar imagem
  # de código não validado ou vinda de um fork nao confiavel.
  build-and-push:
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/welersonepora/personal-assistant-backend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image (backend)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/welersonepora/personal-assistant-frontend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image (frontend)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy automático num servidor real (SSH + docker compose pull/up,
      # ver scripts/deploy.sh) ainda não está configurado aqui - depende de
      # onde o Personal Assistant vai rodar em produção (ver docs/deploy.md).
      # Quando existir, este job ganha um passo final igual ao "Deploy on
      # Oracle VM" do AgroMind (.github/workflows/deploy.yml de referência).
