name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------- backend
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # Um único banco cobre dev e test neste job efêmero de CI - POSTGRES_DB
      # e POSTGRES_DB_TEST abaixo apontam para o mesmo nome, então
      # "db:migrate" (env development) já deixa o schema pronto para os
      # testes de integração (env test) sem precisar de um segundo createdb.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: personal_assistant_test
          POSTGRES_USER: personal_assistant
          POSTGRES_PASSWORD: personal_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personal_assistant -d personal_assistant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: development
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: personal_assistant_test
      POSTGRES_DB_TEST: personal_assistant_test
      POSTGRES_USER: personal_assistant
      POSTGRES_PASSWORD: personal_assistant
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run db:migrate

      # Roda os seeders no mesmo banco efêmero do CI: pega drift entre um
      # seeder e uma migration posterior (ex.: seeder inserindo coluna que
      # uma migration depois removeu) antes do deploy, já que scripts/deploy.sh
      # roda "db:seed" a cada publicação.
      - name: Run seeders
        run: npm run db:seed

      - name: Run tests
        run: npm test

  # --------------------------------------------------------------- frontend
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # ----------------------------------------------- build & publish (GHCR)
  # Só builda/publica depois que os dois jobs de teste passam, e só em push
  # direto para main (nunca em pull_request de fora) - evita publicar imagem
  # de código não validado ou vinda de um fork nao confiavel.
  build-and-push:
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/welersonepora/personal-assistant-backend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image (backend)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/welersonepora/personal-assistant-frontend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image (frontend)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Mesma VM Oracle do AgroMind (deploy solicitado assim), stack Docker
      # totalmente separada (projeto "personal-assistant", ver docs/adr/0001).
      # Login no GHCR não é feito aqui de propósito: o usuário "deploy" já
      # tem uma sessão docker login persistida no host (usada pelo próprio
      # deploy do AgroMind, que a renova a cada execução) - reaproveitada em
      # vez de duplicar GHCR_USERNAME/GHCR_PAT como secrets também aqui.
      - name: Deploy on Oracle VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            sudo -iu deploy bash -lc 'cd /opt/apps/personal-assistant/app && git pull --ff-only && chmod +x scripts/deploy.sh && bash scripts/deploy.sh'
